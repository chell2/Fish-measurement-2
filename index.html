<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>魚体測定 音声入力</title>

  <style>
    body {
      margin: 0;
      padding: 16px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    .app {
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      font-size: 24px;
      margin: 0 0 16px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    input,
    textarea,
    select {
      width: 100%;
      box-sizing: border-box;
      font-size: 16px;
      padding: 10px 12px;
      border: 1px solid #d8dde8;
      border-radius: 10px;
      background: #fff;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 12px 18px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .primary { background: #1a73e8; color: #fff; }
    .danger { background: #d93025; color: #fff; }
    .secondary { background: #e8eefb; color: #1a3d7c; }

    .save {
      background: #188038;
      color: #fff;
      width: 100%;
      margin-top: 12px;
      padding: 14px 18px;
    }

    .status {
      font-weight: 700;
      margin-top: 8px;
      white-space: pre-wrap;
    }

    .listening { color: #d93025; }
    .processing { color: #1a73e8; }
    .ok { color: #188038; }
    .error { color: #d93025; }

    /* 音量メーター */
    .mic-meter-wrapper {
      margin-top: 12px;
      padding: 12px;
      background: #f0f4f9;
      border-radius: 10px;
    }

    .mic-meter-label {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }

    .progress-container {
      background: #d8dde8;
      border-radius: 8px;
      height: 16px;
      width: 100%;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: #aaaaaa;
      transition: width 0.05s linear;
    }

    .hint {
      font-size: 14px;
      color: #555;
      line-height: 1.7;
    }

    .table-wrap { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 640px;
    }

    th, td {
      border-bottom: 1px solid #e6e9f0;
      padding: 8px;
      text-align: left;
      vertical-align: middle;
    }

    th {
      font-size: 13px;
      background: #f8fafd;
    }

    td input, td select {
      padding: 8px;
      font-size: 15px;
    }

    .small-btn {
      padding: 8px 10px;
      font-size: 13px;
      border-radius: 8px;
    }

    .invalid-row { background: #fff4f4; }
    .empty { color: #777; text-align: center; padding: 24px 8px; }

    @media (max-width: 640px) {
      body { padding: 12px; }
      .grid { grid-template-columns: 1fr; }
      h1 { font-size: 21px; }
      button { width: 100%; }
    }
  </style>
</head>

<body>
  <div class="app">
    <h1>魚体測定 音声入力</h1>

    <div class="card">
      <div class="grid">
        <div>
          <label for="measurementDate">測定日</label>
          <input type="date" id="measurementDate">
        </div>

        <div>
          <label for="measurer">測定者</label>
          <input type="text" id="measurer" placeholder="例：三吉">
        </div>
      </div>
    </div>

    <div class="card">
      <label>音声入力</label>

      <div class="hint">
        話し方の例：<br>
        「10番 13センチ 27グラム」<br>
        「13センチ 36グラム 形態異常B」<br>
        「11センチ 18グラム 形態異常C」
      </div>

      <!-- 隠しファイル選択 -->
      <input type="file" id="audioFileInput" accept="audio/*" style="display: none;" onchange="uploadAndProcessAudio(this)">

      <div class="buttons">
        <button class="secondary" onclick="runMicTest()">🎙️ マイク音量テスト</button>
        <button class="primary" onclick="startListening()">マイク開始</button>
        <button class="danger" onclick="stopListening()">マイク停止</button>
        <button class="secondary" onclick="document.getElementById('audioFileInput').click()">📁 録音ファイルを解析</button>
        <button class="secondary" onclick="addManualRow()">手入力で1行追加</button>
      </div>

      <!-- マイク音量レベルメーター -->
      <div class="mic-meter-wrapper">
        <div class="mic-meter-label">
          <span>マイク入力音量</span>
          <span id="micVolumeValue">0 %</span>
        </div>
        <div class="progress-container">
          <div id="micVolumeBar" class="progress-bar"></div>
        </div>
      </div>

      <div id="status" class="status">待機中</div>

      <div style="margin-top: 12px;">
        <label for="latestText">テキスト化結果</label>
        <textarea id="latestText" placeholder="ここに解析結果が表示されます。"></textarea>
      </div>
    </div>

    <div class="card">
      <label>測定一覧</label>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th style="width:100px;">ナンバー</th>
              <th style="width:140px;">体長cm</th>
              <th style="width:140px;">体重g</th>
              <th style="width:130px;">変形レベル</th>
              <th style="width:90px;">操作</th>
            </tr>
          </thead>

          <tbody id="tbody">
            <tr>
              <td colspan="5" class="empty">まだ測定データがありません</td>
            </tr>
          </tbody>
        </table>
      </div>

      <button class="save" onclick="saveRows()">スプレッドシートに登録</button>
      <div id="saveStatus" class="status"></div>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. 設定用定数（ここを書き換えてください）
    // ==========================================
    const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzoaUgf3om8gRnXOXOxpA1ZfoUaiygsriozMvjVaxnGcd7QhGLtp-7N25OFtexV0FeFlQ/exec';


    // ==========================================
    // 2. アプリのメイン処理
    // ==========================================
    let recognition = null;
    let isListening = false;
    let rows = [];

    // 音量計算用オブジェクト
    let audioCtx = null;
    let analyser = null;
    let micStream = null;
    let animFrameId = null;

    window.addEventListener('DOMContentLoaded', () => {
      if (!GAS_WEB_APP_URL || GAS_WEB_APP_URL.includes('YOUR_DEPLOY_ID')) {
        setStatus('GASのURLが設定されていません。<script>冒頭のGAS_WEB_APP_URLを設定してください。', 'error');
      }

      const today = new Date();
      const yyyy = today.getFullYear();
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const dd = String(today.getDate()).padStart(2, '0');

      document.getElementById('measurementDate').value = `${yyyy}-${mm}-${dd}`;
      renderTable();
      setupSpeechRecognition();
    });

    // --- 音量メーター処理（競合を防ぐため独立動作） ---
    async function startVolumeMeter() {
      try {
        stopVolumeMeter();

        micStream = await navigator.mediaDevices.getUserMedia({ 
          audio: { echoCancellation: false, noiseSuppression: false } 
        });

        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') {
          await audioCtx.resume();
        }

        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 512;
        analyser.smoothingTimeConstant = 0.3;

        const source = audioCtx.createMediaStreamSource(micStream);
        source.connect(analyser);

        const dataArray = new Uint8Array(analyser.frequencyBinCount);
        const bar = document.getElementById('micVolumeBar');
        const valText = document.getElementById('micVolumeValue');

        function update() {
          if (!analyser) return;
          analyser.getByteFrequencyData(dataArray);

          let sum = 0;
          for (let i = 0; i < dataArray.length; i++) {
            sum += dataArray[i] * dataArray[i];
          }
          let rms = Math.sqrt(sum / dataArray.length);
          let level = Math.min(100, Math.round((rms / 128) * 100 * 2.2));

          bar.style.width = level + '%';
          valText.textContent = level + ' %';

          if (level > 75) {
            bar.style.background = '#d93025';
          } else if (level > 3) {
            bar.style.background = '#188038';
          } else {
            bar.style.background = '#aaaaaa';
          }

          animFrameId = requestAnimationFrame(update);
        }

        update();
        return true;
      } catch (err) {
        setStatus(`マイクアクセスエラー: ブラウザのアドレスバー付近でマイクがブロックされていないか確認してください。（${err.message}）`, 'error');
        return false;
      }
    }

    function stopVolumeMeter() {
      if (animFrameId) cancelAnimationFrame(animFrameId);
      animFrameId = null;
      if (micStream) {
        micStream.getTracks().forEach(t => t.stop());
        micStream = null;
      }
      if (audioCtx) {
        audioCtx.close();
        audioCtx = null;
      }
      analyser = null;

      document.getElementById('micVolumeBar').style.width = '0%';
      document.getElementById('micVolumeBar').style.background = '#aaaaaa';
      document.getElementById('micVolumeValue').textContent = '0 %';
    }

    // マイク音量テスト（5秒間計測とリアルタイム解決案内）
    async function runMicTest() {
      if (isListening) stopListening(); // リアルタイム聞き取り中の場合は一時停止

      setStatus(
        'マイク音量テスト中（5秒間）... マイクに向かって声を出してください。\n' +
        '【音量が 0% のまま動かない場合の確認項目】\n' +
        '① ブラウザのアドレスバー横で「マイクの許可」が選ばれているか\n' +
        '② OS設定（Windows/Mac）で正しい「入力マイク」が選ばれているか\n' +
        '③ OS設定（Windows/Mac）で「マイク入力音量」が0%やミュートになっていないか', 
        'processing'
      );

      let maxLevelDetected = 0;
      const ok = await startVolumeMeter();
      if (!ok) return;

      const checkInterval = setInterval(() => {
        const valText = document.getElementById('micVolumeValue').textContent;
        const currentLevel = parseInt(valText, 10) || 0;
        if (currentLevel > maxLevelDetected) {
          maxLevelDetected = currentLevel;
        }
      }, 100);

      setTimeout(() => {
        clearInterval(checkInterval);
        stopVolumeMeter(); // 音声認識の邪魔にならないようテスト後はマイクを即座に解放

        if (maxLevelDetected > 3) {
          setStatus(`テスト完了：音声入力を正常に検知しました！（最大音量: ${maxLevelDetected}%）`, 'ok');
        } else {
          setStatus(
            'テスト完了：音量が検知されませんでした（0%）。\n' +
            '上記の確認項目（①〜③）をご確認の上、端末の設定を見直してください。', 
            'error'
          );
        }
      }, 5000);
    }

    // --- 音声入力・録音ファイル処理 ---
    async function uploadAndProcessAudio(input) {
      const file = input.files[0];
      if (!file) return;

      try {
        setStatus(`ファイル「${file.name}」を読み込んでいます...`, 'processing');
        const base64Data = await fileToBase64(file);

        setStatus(`クラウドで解析中... 数秒お待ちください`, 'processing');

        const payload = {
          action: 'transcribeAudio',
          fileData: base64Data,
          mimeType: file.type || 'audio/m4a'
        };

        const response = await fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });

        const resData = await response.json();
        if (!resData.ok) throw new Error(resData.error);

        document.getElementById('latestText').value = resData.text;
        const parsedRows = parseAiResultText(resData.text);

        if (parsedRows.length > 0) {
          rows.push(...parsedRows);
          renderTable();
          setStatus(`解析完了！ ${parsedRows.length} 件の測定データを追加しました。`, 'ok');
        } else {
          setStatus('音声から数値データを抽出できませんでした。', 'error');
        }

      } catch (err) {
        setStatus(`解析エラー: ${err.message}`, 'error');
      } finally {
        input.value = '';
      }
    }

    // 変形レベルの文字列からアルファベット（A, B, C, なし）を抽出
    function findDeformityLevel(text) {
      const str = String(text || '').trim();

      if (str.match(/(?:形態異常|変形|レベル|異常|タイプ)?\s*([Cсシーしー])/i)) return 'C';
      if (str.match(/(?:形態異常|変形|レベル|異常|タイプ)?\s*([Bｂビーびー])/i)) return 'B';
      if (str.match(/(?:形態異常|変形|レベル|異常|タイプ)?\s*([Aａエーえー])/i)) return 'A';
      if (str.match(/なし|無し|無|正常/)) return 'なし';

      return 'なし';
    }

    function parseAiResultText(text) {
      const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
      const parsed = [];
      let lastNumber = getLastNumberInRows();

      lines.forEach(line => {
        const parts = line.split(/\s+/);
        if (parts.length < 3) return;

        let rawNum = parts[0];
        let lengthCm = Number(parts[1]);
        let weightG = Number(parts[2]);
        let rawDeformity = parts.slice(3).join(' ') || 'なし';

        if (!isFinite(lengthCm) || !isFinite(weightG)) return;

        let currentNumber = '';
        if (rawNum !== '-' && isFinite(Number(rawNum))) {
          currentNumber = String(Number(rawNum));
          lastNumber = Number(rawNum);
        } else {
          lastNumber++;
          currentNumber = String(lastNumber);
        }

        let deformity = findDeformityLevel(rawDeformity);

        parsed.push({ number: currentNumber, lengthCm, weightG, deformity });
      });

      return parsed;
    }

    function getLastNumberInRows() {
      if (rows.length === 0) return 0;
      return rows.reduce((max, row) => {
        const n = Number(row.number);
        return isFinite(n) && n > max ? n : max;
      }, 0);
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = error => reject(error);
      });
    }

    // リアルタイムマイク（Web Speech API）用処理
    function setupSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        setStatus('このブラウザはリアルタイム音声入力に対応していません。Chromeを利用してください。', 'error');
        return;
      }

      recognition = new SpeechRecognition();
      recognition.lang = 'ja-JP';
      recognition.continuous = true;
      recognition.interimResults = true;

      recognition.onstart = () => {
        setStatus('マイク聞き取り中... 測定値を話してください。', 'listening');
      };

      recognition.onresult = (event) => {
        let transcript = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          transcript += event.results[i][0].transcript;
        }
        if (transcript) {
          document.getElementById('latestText').value = transcript;
        }
      };

      recognition.onerror = (event) => {
        if (event.error !== 'no-speech') {
          setStatus(`音声認識エラー: ${event.error}`, 'error');
        }
      };

      recognition.onend = () => {
        if (isListening) {
          try { recognition.start(); } catch (e) {}
        } else {
          setStatus('マイク停止中', '');
        }
      };
    }

    function startListening() {
      stopVolumeMeter(); // 音量テストが動いていれば停止してマイクを完全に解放
      if (!recognition) setupSpeechRecognition();

      isListening = true;
      try {
        recognition.start();
      } catch (e) {
        setStatus('すでに聞き取り中です。', 'listening');
      }
    }

    function stopListening() {
      isListening = false;
      if (recognition) recognition.stop();
      setStatus('マイク停止中', '');
    }

    // テーブル操作関数群
    function addManualRow() {
      const nextNum = getLastNumberInRows() + 1;
      rows.push({ number: String(nextNum), lengthCm: '', weightG: '', deformity: 'なし' });
      renderTable();
    }

    function renderTable() {
      const tbody = document.getElementById('tbody');

      if (rows.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="empty">まだ測定データがありません</td></tr>`;
        return;
      }

      tbody.innerHTML = rows.map((row, index) => {
        const invalid = !isValidRow(row);
        return `
          <tr class="${invalid ? 'invalid-row' : ''}">
            <td><input type="text" value="${escapeHtml(row.number)}" onchange="updateRow(${index}, 'number', this.value)"></td>
            <td><input type="number" step="0.1" value="${escapeHtml(row.lengthCm)}" onchange="updateRow(${index}, 'lengthCm', this.value)"></td>
            <td><input type="number" step="0.1" value="${escapeHtml(row.weightG)}" onchange="updateRow(${index}, 'weightG', this.value)"></td>
            <td>
              <select onchange="updateRow(${index}, 'deformity', this.value)">
                <option value="なし" ${row.deformity === 'なし' ? 'selected' : ''}>なし</option>
                <option value="A" ${row.deformity === 'A' ? 'selected' : ''}>A</option>
                <option value="B" ${row.deformity === 'B' ? 'selected' : ''}>B</option>
                <option value="C" ${row.deformity === 'C' ? 'selected' : ''}>C</option>
              </select>
            </td>
            <td><button class="danger small-btn" onclick="deleteRow(${index})">削除</button></td>
          </tr>
        `;
      }).join('');
    }

    function updateRow(index, key, value) {
      rows[index][key] = value;
      renderTable();
    }

    function deleteRow(index) {
      rows.splice(index, 1);
      renderTable();
    }

    function isValidRow(row) {
      return String(row.number || '').trim() !== '' &&
        isFinite(Number(row.lengthCm)) && Number(row.lengthCm) > 0 &&
        isFinite(Number(row.weightG)) && Number(row.weightG) > 0;
    }

    async function saveRows() {
      const measurementDate = document.getElementById('measurementDate').value;
      const measurer = document.getElementById('measurer').value.trim();

      if (!measurementDate || !measurer || rows.length === 0) {
        setSaveStatus('必須項目（測定日・測定者）または測定データが足りません。', 'error');
        return;
      }

      const payload = {
        action: 'save',
        measurementDate,
        measurer,
        rows: rows.map(r => ({
          number: String(r.number).trim(),
          lengthCm: Number(r.lengthCm),
          weightG: Number(r.weightG),
          deformity: String(r.deformity).trim()
        }))
      };

      setSaveStatus('スプレッドシートへ保存中...', '');

      try {
        const response = await fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });

        const resData = await response.json();

        if (resData.ok) {
          setSaveStatus(`${resData.count}件のデータをスプレッドシートに登録しました！`, 'ok');
          rows = [];
          renderTable();
          document.getElementById('latestText').value = '';
        } else {
          setSaveStatus(`保存エラー: ${resData.error}`, 'error');
        }
      } catch (e) {
        setSaveStatus(`通信エラー: ${e.message}`, 'error');
      }
    }

    function setStatus(message, type) {
      const el = document.getElementById('status');
      el.textContent = message;
      el.className = `status ${type || ''}`;
    }

    function setSaveStatus(message, type) {
      const el = document.getElementById('saveStatus');
      el.textContent = message;
      el.className = `status ${type || ''}`;
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
