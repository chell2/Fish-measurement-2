<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>魚体測定 音声入力</title>

  <style>
    body {
      margin: 0;
      padding: 16px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    .app {
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      font-size: 24px;
      margin: 0 0 16px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    input,
    textarea,
    select {
      width: 100%;
      box-sizing: border-box;
      font-size: 16px;
      padding: 10px 12px;
      border: 1px solid #d8dde8;
      border-radius: 10px;
      background: #fff;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 12px 18px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .primary {
      background: #1a73e8;
      color: #fff;
    }

    .danger {
      background: #d93025;
      color: #fff;
    }

    .secondary {
      background: #e8eefb;
      color: #1a3d7c;
    }

    .save {
      background: #188038;
      color: #fff;
      width: 100%;
      margin-top: 12px;
      padding: 14px 18px;
    }

    .status {
      font-weight: 700;
      margin-top: 8px;
    }

    .listening {
      color: #d93025;
    }

    .ok {
      color: #188038;
    }

    .error {
      color: #d93025;
    }

    .hint {
      font-size: 14px;
      color: #555;
      line-height: 1.7;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 640px;
    }

    th,
    td {
      border-bottom: 1px solid #e6e9f0;
      padding: 8px;
      text-align: left;
      vertical-align: middle;
    }

    th {
      font-size: 13px;
      background: #f8fafd;
    }

    td input,
    td select {
      padding: 8px;
      font-size: 15px;
    }

    .small-btn {
      padding: 8px 10px;
      font-size: 13px;
      border-radius: 8px;
    }

    .invalid-row {
      background: #fff4f4;
    }

    .empty {
      color: #777;
      text-align: center;
      padding: 24px 8px;
    }

    .note {
      font-size: 13px;
      color: #666;
      margin-top: 8px;
      line-height: 1.6;
    }

    @media (max-width: 640px) {
      body {
        padding: 12px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 21px;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <h1>魚体測定 音声入力</h1>

    <div class="card">
      <div class="grid">
        <div>
          <label for="measurementDate">測定日</label>
          <input type="date" id="measurementDate">
        </div>

        <div>
          <label for="measurer">測定者</label>
          <input type="text" id="measurer" placeholder="例：三吉">
        </div>
      </div>
    </div>

    <div class="card">
      <label>音声入力</label>

      <div class="hint">
        話し方の例：<br>
        「10番 13センチ 27グラム」<br>
        「13センチ 36グラム 形態異常B」<br>
        「11センチ 18グラム 形態異常C」
      </div>

      <!-- 隠しファイル入力要素 -->
      <input type="file" id="audioFileInput" accept="audio/*" style="display: none;" onchange="handleAudioFile(this)">

      <div class="buttons">
        <button class="secondary" onclick="checkMicrophoneAccess()">マイク接続テスト</button>
        <button class="primary" onclick="startListening()">マイク開始</button>
        <button class="danger" onclick="stopListening()">マイク停止</button>
        <!-- ▼ 録音ファイル読み込みボタンを追加 ▼ -->
        <button class="secondary" onclick="document.getElementById('audioFileInput').click()">録音ファイルから読み込み</button>
        <button class="secondary" onclick="processBufferedText()">確定して解析</button>
        <button class="secondary" onclick="addManualRow()">手入力で1行追加</button>
      </div>
      <!-- 再生用オーディオ要素 -->
      <audio id="audioPlayer" style="display: none;"></audio>

      <div id="status" class="status">待機中</div>

      <div style="margin-top: 12px;">
        <label for="latestText">聞き取り結果（リアルタイム蓄積）</label>
        <textarea id="latestText" placeholder="ここに聞き取った内容が表示されます。音声停止時または数秒の沈黙で自動的に測定一覧に展開されます。"></textarea>
      </div>
    </div>

    <div class="card">
      <label>測定一覧</label>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th style="width:100px;">ナンバー</th>
              <th style="width:140px;">体長cm</th>
              <th style="width:140px;">体重g</th>
              <th style="width:130px;">変形レベル</th>
              <th style="width:90px;">操作</th>
            </tr>
          </thead>

          <tbody id="tbody">
            <tr>
              <td colspan="5" class="empty">まだ測定データがありません</td>
            </tr>
          </tbody>
        </table>
      </div>

      <button class="save" onclick="saveRows()">スプレッドシートに登録</button>
      <div id="saveStatus" class="status"></div>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. 設定用定数（ここを書き換えてください）
    // ==========================================
    /** GASのWebアプリURL */
    const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzoaUgf3om8gRnXOXOxpA1ZfoUaiygsriozMvjVaxnGcd7QhGLtp-7N25OFtexV0FeFlQ/exec';


    // ==========================================
    // 2. アプリのメイン処理
    // ==========================================
    let recognition = null;
    let isListening = false;
    let rows = [];
    let accumulatedText = '';
    let silenceTimer = null;

    window.addEventListener('DOMContentLoaded', () => {
      // URLの設定チェック
      if (!GAS_WEB_APP_URL || GAS_WEB_APP_URL.includes('YOUR_DEPLOY_ID')) {
        setStatus('GASのURLが設定されていません。<script>冒頭のGAS_WEB_APP_URLを設定してください。', 'error');
      }

      const today = new Date();
      const yyyy = today.getFullYear();
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const dd = String(today.getDate()).padStart(2, '0');

      document.getElementById('measurementDate').value = `${yyyy}-${mm}-${dd}`;

      setupSpeechRecognition();
      renderTable();
      checkMicrophoneAccess(true); // 起動時にマイク事前チェック（警告を出さないサイレント確認）
    });

    // 録音ファイルが選択された時の処理
    async function handleAudioFile(input) {
      const file = input.files[0];
      if (!file) return;

      const audioPlayer = document.getElementById('audioPlayer');
      audioPlayer.src = URL.createObjectURL(file);

      setStatus(`ファイル「${file.name}」を読み込みました。解析を開始します...`, 'listening');

      // 音声認識の準備
      if (!recognition) {
        setupSpeechRecognition();
      }

      try {
        // 蓄積テキストの初期化
        accumulatedText = '';
        document.getElementById('latestText').value = '';

        // マイク/音声認識を開始してオーディオを再生
        isListening = true;
        recognition.start();
        await audioPlayer.play();

        // 音声再生が終わったら自動停止して解析
        audioPlayer.onended = () => {
          stopListening();
          setStatus('録音ファイルの再生・聞き取りが完了しました。', 'ok');
          // ファイル選択をリセット
          input.value = '';
        };

      } catch (e) {
        setStatus(`ファイル再生エラー: ${e.message}`, 'error');
      }
    }

    // マイク接続確認機能
    async function checkMicrophoneAccess(silent = false) {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        if (!silent) setStatus('このブラウザはマイクデバイスの検出に対応していません。', 'error');
        return false;
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        stream.getTracks().forEach(track => track.stop());
        if (!silent) setStatus('マイクが正常に認識されています。利用可能です。', 'ok');
        return true;
      } catch (err) {
        if (!silent) {
          if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
            setStatus('マイクへのアクセス権限が拒否されています。ブラウザの設定でマイクを許可してください。', 'error');
          } else {
            setStatus(`マイク接続エラー: ${err.message}`, 'error');
          }
        }
        return false;
      }
    }

    function setupSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

      if (!SpeechRecognition) {
        setStatus('このブラウザは音声入力に対応していません。ChromeまたはiOS Safariを利用してください。', 'error');
        return;
      }

      recognition = new SpeechRecognition();
      recognition.lang = 'ja-JP';
      recognition.continuous = true;
      recognition.interimResults = true;

      recognition.onstart = () => {
        setStatus('聞き取り中です。測定値を話してください...', 'listening');
      };

      recognition.onresult = (event) => {
        let interim = '';

        for (let i = event.resultIndex; i < event.results.length; i++) {
          const transcript = event.results[i][0].transcript;

          if (event.results[i].isFinal) {
            accumulatedText += ' ' + transcript;
          } else {
            interim += transcript;
          }
        }

        const displayText = (accumulatedText + ' ' + interim).trim();
        document.getElementById('latestText').value = displayText;

        // 音声入力が少し途切れたら（2.5秒間無音なら）自動的に解析処理を実行
        clearTimeout(silenceTimer);
        silenceTimer = setTimeout(() => {
          if (accumulatedText.trim().length > 0) {
            processBufferedText();
          }
        }, 2500);
      };

      recognition.onerror = (event) => {
        if (event.error !== 'no-speech') {
          setStatus(`音声認識エラー：${event.error}`, 'error');
        }
      };

      recognition.onend = () => {
        if (isListening) {
          try {
            recognition.start();
          } catch (e) {
            // 再スタート保護
          }
        } else {
          setStatus('マイク停止中', '');
        }
      };
    }

    async function startListening() {
      const micOk = await checkMicrophoneAccess(false);
      if (!micOk) return;

      if (!recognition) {
        setupSpeechRecognition();
      }

      isListening = true;

      try {
        recognition.start();
      } catch (e) {
        setStatus('すでに聞き取り中です。', 'listening');
      }
    }

    function stopListening() {
      isListening = false;
      clearTimeout(silenceTimer);

      if (recognition) {
        recognition.stop();
      }

      processBufferedText();
    }

    // 蓄積テキストをテーブル行へ展開・解析
    function processBufferedText() {
      const textToProcess = accumulatedText.trim() || document.getElementById('latestText').value.trim();
      if (!textToProcess) return;

      const parsedRows = parseSpeechText(textToProcess);

      if (parsedRows.length > 0) {
        rows.push(...parsedRows);
        renderTable();
        setStatus(`${parsedRows.length}件のデータを追加しました。`, 'ok');
        
        accumulatedText = '';
        document.getElementById('latestText').value = '';
      } else {
        setStatus('測定数値をうまく読み取れませんでした。手動で修正・入力してください。', 'error');
      }
    }

    // 高精度テキスト解析ロジック
    function parseSpeechText(text) {
      const normalized = normalizeText(text);

      let rawChunks = normalized
        .replace(/(\d+)\s*(?:番|ばん)/g, '\n$1番 ')
        .split(/[\n。！？]/)
        .map(s => s.trim())
        .filter(Boolean);

      const parsed = [];

      rawChunks.forEach(chunk => {
        const parsedRows = parseOneChunk(chunk);
        if (parsedRows && parsedRows.length > 0) {
          parsed.push(...parsedRows);
        }
      });

      return parsed;
    }

    function parseOneChunk(chunk) {
      let number = null;
      
      const numberMatch = chunk.match(/(\d+)\s*(?:番|ばん|ナンバー|no|No|NO)/);
      if (numberMatch) {
        number = numberMatch[1];
      }

      let bodyText = chunk.replace(/(\d+)\s*(?:番|ばん|ナンバー|no|No|NO)/g, '').trim();

      const nums = bodyText.match(/[0-9]+(?:\.[0-9]+)?/g) || [];
      if (nums.length < 2) return null;

      let deformity = findDeformityLevel(bodyText);

      const results = [];
      
      for (let i = 0; i < nums.length - 1; i += 2) {
        const lengthCm = Number(nums[i]);
        const weightG = Number(nums[i + 1]);

        if (isFinite(lengthCm) && isFinite(weightG)) {
          results.push({
            number: number || String(getNextNumber() + results.length),
            lengthCm,
            weightG,
            deformity: deformity || 'なし'
          });
        }
      }

      return results;
    }

    function normalizeText(text) {
      return String(text || '')
        .replace(/[０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0))
        .replace(/[Ａ-Ｚａ-ｚ]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0))
        .replace(/．/g, '.')
        .replace(/点/g, '.')
        .replace(/センチメートル|センチ|cm/gi, '')
        .replace(/グラム|g/gi, '')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function findDeformityLevel(text) {
      const compact = String(text || '').replace(/\s+/g, '');

      if (compact.match(/形態異常C|変形C|レベルC|シー|しー/)) return 'C';
      if (compact.match(/形態異常B|変形B|レベルB|ビー|びー/)) return 'B';
      if (compact.match(/形態異常A|変形A|レベルA|エー|えー/)) return 'A';
      if (compact.match(/変形なし|異常なし|問題なし|なし|無し/)) return 'なし';

      return '';
    }

    function getNextNumber() {
      if (rows.length === 0) return 1;

      const maxNumber = rows.reduce((max, row) => {
        const n = Number(row.number);
        return isFinite(n) && n > max ? n : max;
      }, 0);

      return maxNumber + 1;
    }

    function addManualRow() {
      rows.push({
        number: String(getNextNumber()),
        lengthCm: '',
        weightG: '',
        deformity: 'なし'
      });

      renderTable();
    }

    function renderTable() {
      const tbody = document.getElementById('tbody');

      if (rows.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="5" class="empty">まだ測定データがありません</td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = rows.map((row, index) => {
        const invalid = !isValidRow(row);

        return `
          <tr class="${invalid ? 'invalid-row' : ''}">
            <td>
              <input type="text" value="${escapeHtml(row.number)}" onchange="updateRow(${index}, 'number', this.value)">
            </td>

            <td>
              <input type="number" step="0.1" value="${escapeHtml(row.lengthCm)}" onchange="updateRow(${index}, 'lengthCm', this.value)">
            </td>

            <td>
              <input type="number" step="0.1" value="${escapeHtml(row.weightG)}" onchange="updateRow(${index}, 'weightG', this.value)">
            </td>

            <td>
              <select onchange="updateRow(${index}, 'deformity', this.value)">
                <option value="なし" ${row.deformity === 'なし' ? 'selected' : ''}>なし</option>
                <option value="A" ${row.deformity === 'A' ? 'selected' : ''}>A</option>
                <option value="B" ${row.deformity === 'B' ? 'selected' : ''}>B</option>
                <option value="C" ${row.deformity === 'C' ? 'selected' : ''}>C</option>
              </select>
            </td>

            <td>
              <button class="danger small-btn" onclick="deleteRow(${index})">削除</button>
            </td>
          </tr>
        `;
      }).join('');
    }

    function updateRow(index, key, value) {
      rows[index][key] = value;
      renderTable();
    }

    function deleteRow(index) {
      rows.splice(index, 1);
      renderTable();
    }

    function isValidRow(row) {
      const deformity = String(row.deformity || '').trim();

      return String(row.number || '').trim() !== '' &&
        isFinite(Number(row.lengthCm)) &&
        isFinite(Number(row.weightG)) &&
        Number(row.lengthCm) > 0 &&
        Number(row.weightG) > 0 &&
        ['なし', 'A', 'B', 'C'].includes(deformity);
    }

    async function saveRows() {
      const measurementDate = document.getElementById('measurementDate').value;
      const measurer = document.getElementById('measurer').value.trim();

      if (!measurementDate) {
        setSaveStatus('測定日を入力してください。', 'error');
        return;
      }

      if (!measurer) {
        setSaveStatus('測定者を入力してください。', 'error');
        return;
      }

      if (rows.length === 0) {
        setSaveStatus('登録する測定データがありません。', 'error');
        return;
      }

      const invalidRows = rows.filter(row => !isValidRow(row));

      if (invalidRows.length > 0) {
        setSaveStatus('未入力または不正な行があります。赤い行を修正してください。', 'error');
        return;
      }

      if (!GAS_WEB_APP_URL || GAS_WEB_APP_URL.includes('YOUR_DEPLOY_ID')) {
        setSaveStatus('GASのWebアプリURLが設定されていません。コード内のURLを確認してください。', 'error');
        return;
      }

      const payload = {
        measurementDate,
        measurer,
        rows: rows.map(row => ({
          number: String(row.number).trim(),
          lengthCm: Number(row.lengthCm),
          weightG: Number(row.weightG),
          deformity: String(row.deformity).trim()
        }))
      };

      setSaveStatus('保存中です...', '');

      try {
        const response = await fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'text/plain;charset=utf-8',
          },
          body: JSON.stringify(payload)
        });

        const resData = await response.json();

        if (resData.ok) {
          setSaveStatus(`${resData.count}件登録しました。`, 'ok');
          rows = [];
          renderTable();
          document.getElementById('latestText').value = '';
          accumulatedText = '';
        } else {
          setSaveStatus(`保存できませんでした：${resData.error}`, 'error');
        }
      } catch (e) {
        setSaveStatus(`通信エラーが発生しました：${e.message}`, 'error');
      }
    }

    function setStatus(message, type) {
      const el = document.getElementById('status');
      el.textContent = message;
      el.className = `status ${type || ''}`;
    }

    function setSaveStatus(message, type) {
      const el = document.getElementById('saveStatus');
      el.textContent = message;
      el.className = `status ${type || ''}`;
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
</body>
</html>
