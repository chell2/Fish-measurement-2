<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>魚体測定 音声入力</title>
  <style>
    body {
      margin: 0; padding: 16px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f7fb; color: #222;
    }
    .app { max-width: 900px; margin: 0 auto; }
    h1 { font-size: 24px; margin: 0 0 16px; }
    .card {
      background: #fff; border-radius: 16px; padding: 16px;
      margin-bottom: 16px; box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    }
    label { display: block; font-size: 14px; font-weight: 700; margin-bottom: 6px; }
    
    input, textarea, select {
      width: 100%; box-sizing: border-box; font-size: 16px;
      border: 1px solid #d8dde8; border-radius: 10px; background: #fff; margin: 0;
    }
    input, select { height: 44px; padding: 0 12px; }
    textarea { height: auto; min-height: 90px; padding: 10px 12px; resize: vertical; }

    input[type="date"] {
      -webkit-appearance: none; appearance: none; display: block; height: 44px;
    }
    input[type="date"]::-webkit-datetime-edit,
    input[type="date"]::-webkit-datetime-edit-fields-wrapper {
      display: flex; align-items: center; height: 100%; line-height: normal;
    }

    .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
    .grid > div { min-width: 0; }
    
    .input-group { display: flex; width: 100%; }
    .input-group select { 
      border-radius: 10px 0 0 10px; border-right: none; flex-grow: 1; min-width: 0;
    }

    .buttons { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
    button {
      border: none; border-radius: 999px; padding: 12px 18px;
      font-size: 16px; font-weight: 700; cursor: pointer; margin: 0;
    }
    button.del-btn {
      border-radius: 0 !important; border: 1px solid #d8dde8 !important; border-right: none !important; 
      background: #fff4f4; color: #d93025; padding: 0 14px; font-size: 16px; font-weight: bold;
      height: 44px; box-sizing: border-box; display: flex; align-items: center; justify-content: center;
    }
    button.del-btn:active { background: #fde8e8; }
    button.add-btn {
      border-radius: 0 10px 10px 0 !important; border: 1px solid #d8dde8 !important; 
      background: #f8fafd; color: #1a73e8; padding: 0 16px; font-size: 18px; font-weight: bold;
      height: 44px; box-sizing: border-box; display: flex; align-items: center; justify-content: center;
    }
    button.add-btn:active { background: #e8eefb; }

    .primary { background: #1a73e8; color: #fff; }
    .danger { background: #d93025; color: #fff; }
    .secondary { background: #e8eefb; color: #1a3d7c; }
    .save { background: #188038; color: #fff; width: 100%; margin-top: 12px; padding: 14px 18px; }
    .status { font-weight: 700; margin-top: 8px; white-space: pre-wrap; }
    .listening { color: #d93025; }
    .processing { color: #1a73e8; }
    .ok { color: #188038; }
    .error { color: #d93025; }
    
    .hint { font-size: 14px; color: #555; line-height: 1.7; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 640px; }
    th, td { border-bottom: 1px solid #e6e9f0; padding: 8px; text-align: left; vertical-align: middle; }
    th { font-size: 13px; background: #f8fafd; }
    td input, td select { padding: 8px; font-size: 15px; }
    .small-btn { padding: 8px 10px; font-size: 13px; border-radius: 8px; }
    
    .invalid-row { background: #fff4f4; }
    .empty { color: #777; text-align: center; padding: 24px 8px; }

    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center;
      z-index: 1000; visibility: hidden; opacity: 0; transition: opacity 0.2s;
    }
    .modal-overlay.active { visibility: visible; opacity: 1; }
    .modal-content {
      background: #fff; padding: 20px; border-radius: 16px; width: 90%; max-width: 320px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    }
    .modal-content h3 { margin: 0 0 12px; font-size: 18px; }
    .modal-content input, .modal-content select { margin-bottom: 16px; }
    .modal-buttons { display: flex; justify-content: flex-end; gap: 8px; }
    .modal-buttons button { padding: 10px 16px; font-size: 14px; border-radius: 8px; }

    @media (max-width: 640px) {
      body { padding: 12px; } 
      .grid { grid-template-columns: 1fr; }
      h1 { font-size: 21px; } 
      .buttons button { width: 100%; }
      .input-group select { flex: 0 0 66.66%; width: 66.66%; }
      button.del-btn, button.add-btn { flex: 0 0 16.66%; width: 16.66%; padding: 0; }
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>魚体測定 音声入力</h1>

    <div class="card grid">
      <div>
        <label>測定日</label>
        <input type="date" id="measurementDate">
      </div>
      <div>
        <label>測定者</label>
        <div class="input-group">
          <select id="measurer"><option value="">選択してください</option></select>
          <button class="del-btn" onclick="showDeleteModal('measurer')">－</button>
          <button class="add-btn" onclick="showAddModal('measurer')">＋</button>
        </div>
      </div>
      <div>
        <label>水槽</label>
        <div class="input-group">
          <select id="tankName"><option value="">選択してください</option></select>
          <button class="del-btn" onclick="showDeleteModal('tankName')">－</button>
          <button class="add-btn" onclick="showAddModal('tankName')">＋</button>
        </div>
      </div>
    </div>

    <div class="card">
      <label>音声入力</label>
      <p class="hint">話し方の例：「13センチ 36グラム 形態異常C、<b>次</b>」</p>
      
      <div class="buttons">
        <button class="primary" id="startBtn" onclick="toggleMic(true)">マイク開始</button>
        <button class="danger" id="stopBtn" onclick="toggleMic(false)" style="display:none;">マイク停止</button>
      </div>

      <div style="margin-top: 16px;">
        <label>テキスト化結果</label>
        <textarea id="latestText" placeholder="音声がここにテキスト化されます..." readonly></textarea>
        <div id="statusMsg" class="status"></div>
      </div>
      <div class="buttons">
        <button class="secondary" onclick="manualProcess()">表に反映（手動）</button>
      </div>
    </div>

    <div class="card">
      <label>測定一覧（エラー行は赤くなります）</label>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>No.</th><th>体長(cm)</th><th>体重(g)</th><th>形態異常</th><th>操作</th></tr>
          </thead>
          <tbody id="tableBody">
            <tr><td colspan="5" class="empty">データがありません</td></tr>
          </tbody>
        </table>
      </div>
      <div class="buttons">
        <button class="secondary" onclick="addRow()">手入力で追加</button>
      </div>
      
      <button class="save" onclick="saveRows()">登録する</button>
      <div id="saveStatus" class="status"></div>
    </div>
  </div>

  <!-- モーダル群 -->
  <div id="addModal" class="modal-overlay">
    <div class="modal-content">
      <h3 id="addModalTitle">追加</h3>
      <input type="text" id="addModalInput" placeholder="新しい項目を入力">
      <div class="modal-buttons">
        <button class="secondary" onclick="closeModal('addModal')">キャンセル</button>
        <button class="primary" onclick="confirmAddModal()">追加</button>
      </div>
    </div>
  </div>
  <div id="deleteModal" class="modal-overlay">
    <div class="modal-content">
      <h3 id="deleteModalTitle">削除</h3>
      <select id="deleteModalSelect"></select>
      <div class="modal-buttons">
        <button class="secondary" onclick="closeModal('deleteModal')">キャンセル</button>
        <button class="danger" onclick="confirmDeleteModal()">削除</button>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // 設定用定数
    // ==========================================
    const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxp2lcJyDW3NLUnxXGpIB9T7k1S-DnC1xi23yzWJPiFiw4VSmhQjWAjibba1Iqg0o0gBg/exec';

    let listData = { measurers: [], tanks: [] };
    let currentModalTarget = '';

    // ==========================================
    // 音声バッファシステム用変数
    // ==========================================
    let recognition = null;
    let isListening = false;
    let rows = [];
    let silenceTimer = null;
    
    let previousSessionsText = ''; 
    let consumedLength = 0; 

    window.onload = () => {
      document.getElementById('measurementDate').valueAsDate = new Date();
      loadLists();
      setupSpeechRecognition();
    };

    // ==========================================
    // リスト管理
    // ==========================================
    async function loadLists() {
      try {
        const payload = { action: 'getOptions' };
        const response = await fetch(GAS_WEB_APP_URL, { method: 'POST', body: JSON.stringify(payload) });
        const data = await response.json();
        if (data.ok) {
          listData.measurers = data.measurers || [];
          listData.tanks = data.tanks || [];
          populateSelect('measurer', listData.measurers);
          populateSelect('tankName', listData.tanks);
        }
      } catch (error) {
        setStatus('リストの取得に失敗しました。', 'error'); // 文言シンプル化
      }
    }

    function populateSelect(id, items) {
      const select = document.getElementById(id);
      const currentVal = select.value;
      select.innerHTML = '<option value="">選択してください</option>';
      items.forEach(item => {
        const opt = document.createElement('option');
        opt.value = item; opt.textContent = item;
        select.appendChild(opt);
      });
      if (items.includes(currentVal)) select.value = currentVal;
    }

    function showAddModal(target) {
      currentModalTarget = target;
      document.getElementById('addModalTitle').textContent = target === 'measurer' ? '測定者の追加' : '水槽の追加';
      document.getElementById('addModalInput').value = '';
      document.getElementById('addModal').classList.add('active');
    }
    
    async function confirmAddModal() {
      const val = document.getElementById('addModalInput').value.trim();
      if (!val) return;
      closeModal('addModal');
      const gasType = currentModalTarget === 'measurer' ? 'measurer' : 'tank';
      try {
        await fetch(GAS_WEB_APP_URL, { method: 'POST', body: JSON.stringify({ action: 'addOption', type: gasType, value: val }) });
        loadLists();
        // ★ 追記：追加成功のメッセージを表示
        setStatus(`「${val}」を追加しました。`, 'ok');
      } catch (e) { setStatus('項目の追加に失敗しました。', 'error'); }
    }
    
    function showDeleteModal(target) {
      currentModalTarget = target;
      document.getElementById('deleteModalTitle').textContent = target === 'measurer' ? '測定者の削除' : '水槽の削除';
      const select = document.getElementById('deleteModalSelect');
      select.innerHTML = '';
      const items = target === 'measurer' ? listData.measurers : listData.tanks;
      items.forEach(item => {
        const opt = document.createElement('option');
        opt.value = item; opt.textContent = item;
        select.appendChild(opt);
      });
      document.getElementById('deleteModal').classList.add('active');
    }
    
    async function confirmDeleteModal() {
      const val = document.getElementById('deleteModalSelect').value;
      if (!val) return;
      closeModal('deleteModal');
      const gasType = currentModalTarget === 'measurer' ? 'measurer' : 'tank';
      try {
        await fetch(GAS_WEB_APP_URL, { method: 'POST', body: JSON.stringify({ action: 'deleteOption', type: gasType, value: val }) });
        loadLists();
        setStatus(`「${val}」を削除しました。`, 'ok');
      } catch (e) { setStatus('項目の削除に失敗しました。', 'error'); }
    }
    
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }

    // ==========================================
    // 音声認識（バッファ＆文字列引き算システム）
    // ==========================================
    function setupSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) return setStatus('このブラウザは音声入力非対応です。', 'error');
      
      recognition = new SpeechRecognition();
      recognition.lang = 'ja-JP'; 
      recognition.continuous = true; 
      recognition.interimResults = true;

      recognition.onstart = () => {
        consumedLength = 0; 
        setStatus('マイク聞き取り中...', 'listening');
      };

      recognition.onresult = (event) => {
        let currentSessionStr = '';
        for (let i = 0; i < event.results.length; i++) {
          currentSessionStr += event.results[i][0].transcript;
        }

        let activeSessionStr = currentSessionStr.substring(consumedLength);
        let visibleText = previousSessionsText + activeSessionStr;

        while (visibleText.match(/次|つぎ/)) {
          let match = visibleText.match(/次|つぎ/);
          let targetText = visibleText.substring(0, match.index); 
          
          if (targetText.trim()) {
            processTextToTable(targetText); 
          }

          let totalConsumedThisTime = match.index + match[0].length;
          
          if (totalConsumedThisTime >= previousSessionsText.length) {
            consumedLength += (totalConsumedThisTime - previousSessionsText.length);
            previousSessionsText = '';
          } else {
            previousSessionsText = previousSessionsText.substring(totalConsumedThisTime);
          }
          
          activeSessionStr = currentSessionStr.substring(consumedLength);
          visibleText = previousSessionsText + activeSessionStr;
        }

        document.getElementById('latestText').value = visibleText;

        clearTimeout(silenceTimer);
        silenceTimer = setTimeout(() => {
          let finalTarget = document.getElementById('latestText').value.trim();
          if (finalTarget) {
            processTextToTable(finalTarget);
            previousSessionsText = '';
            consumedLength = currentSessionStr.length;
            document.getElementById('latestText').value = '';
          }
        }, 3000);
      };

      recognition.onerror = (e) => { 
        if (e.error !== 'no-speech') setStatus(`音声認識エラー: ${e.error}`, 'error'); 
      };

      recognition.onend = () => {
        let leftover = document.getElementById('latestText').value.trim();
        if (leftover) previousSessionsText = leftover + ' ';
        else previousSessionsText = '';
        
        if (isListening) try { recognition.start(); } catch (e) {}
        else setStatus('マイク停止中', '');
      };
    }

    function toggleMic(start) {
      if (!recognition) return;
      isListening = start;
      document.getElementById('startBtn').style.display = start ? 'none' : 'block';
      document.getElementById('stopBtn').style.display = start ? 'block' : 'none';
      if (start) {
        document.getElementById('latestText').value = '';
        previousSessionsText = '';
        recognition.start();
      } else {
        recognition.stop();
      }
    }

    function setStatus(msg, type) {
      const el = document.getElementById('statusMsg');
      el.textContent = msg;
      el.className = 'status ' + type;
    }

    // ==========================================
    // データ反映・テキスト解析
    // ==========================================
    function processTextToTable(text) {
      if (!text.trim()) return;
      const parsedRows = parseSpeechText(text);
      if (parsedRows.length > 0) {
        rows.push(...parsedRows);
        renderTable();
        setStatus(`${parsedRows.length} 件を表に追加しました。（未入力は赤）`, 'ok');
      } else {
        setStatus('データ（体長・体重など）を読み取れませんでした。', 'error');
      }
    }

    function manualProcess() {
      const text = document.getElementById('latestText').value;
      processTextToTable(text);
      previousSessionsText = '';
      consumedLength += text.length; 
      document.getElementById('latestText').value = '';
    }

    function normalizeText(text) {
      let str = String(text || '');
      const kansujiMap = {'一':'1','二':'2','三':'3','四':'4','五':'5','六':'6','七':'7','八':'8','九':'9'};
      str = str.replace(/([二三四五六七八九])十([一二三四五六七八九])/g, (m, a, b) => kansujiMap[a] + kansujiMap[b]);
      str = str.replace(/([二三四五六七八九])十/g, (m, a) => kansujiMap[a] + '0');
      str = str.replace(/十([一二三四五六七八九])/g, (m, a) => '1' + kansujiMap[a]);
      str = str.replace(/十/g, '10');
      str = str.replace(/[〇一二三四五六七八九]/g, m => (kansujiMap[m] || '0'));
      
      return str.replace(/[０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0))
        .replace(/[Ａ-Ｚａ-ｚ]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0))
        .replace(/．/g, '.').replace(/点/g, '.')
        .replace(/センチメートル|センチ/gi, 'cm')
        .replace(/キログラム|キロ|グラム/gi, 'g')
        .replace(/\s+/g, ' ').trim();
    }

    function findDeformityLevel(text) {
      const str = String(text || '').trim();
      if (str.match(/(?:形態|携帯|変形|レベル|異常|以上|タイプ).*?(?:[Cｃсシーしー]|女子|じょし|よし|四)/i)) return 'C';
      if (str.match(/(?:形態|携帯|変形|レベル|異常|以上|タイプ).*?(?:[Bｂビーびー]|美|微)/i)) return 'B';
      if (str.match(/(?:形態|携帯|変形|レベル|異常|以上|タイプ).*?(?:[Aａエーえー]|絵|へ|で)/i)) return 'A';
      if (str.match(/なし|無し|無|正常/)) return 'なし';
      return 'なし';
    }

    function parseOneChunk(chunk) {
      let number = null;
      const numberMatch = chunk.match(/(\d+)\s*(?:番|ばん|ナンバー|no|No|NO)/i);
      if (numberMatch) number = numberMatch[1];
      
      const lengthMatch = chunk.match(/([0-9]+(?:\.[0-9]+)?)\s*cm/i);
      const weightMatch = chunk.match(/([0-9]+(?:\.[0-9]+)?)\s*g/i);
      let deformity = findDeformityLevel(chunk);
      
      if (!lengthMatch && !weightMatch && deformity === 'なし') return null;
      
      const lengthCm = lengthMatch ? Number(lengthMatch[1]) : '';
      const weightG = weightMatch ? Number(weightMatch[1]) : '';
      
      return [{
        number: number || String(getLastNumberInRows() + 1),
        lengthCm: lengthCm, 
        weightG: weightG, 
        deformity: deformity || 'なし'
      }];
    }

    function parseSpeechText(text) {
      const normalized = normalizeText(text);
      const chunks = normalized.split(/(?=\d+\s*(?:番|ばん|ナンバー|no|No|NO))/i);
      const results = [];
      chunks.forEach(chunk => {
        if (!chunk.trim()) return;
        const parsed = parseOneChunk(chunk);
        if (parsed) results.push(...parsed);
      });
      return results;
    }

    function getLastNumberInRows() {
      if (rows.length === 0) return 0;
      const nums = rows.map(r => Number(r.number)).filter(n => !isNaN(n));
      return nums.length > 0 ? Math.max(...nums) : 0;
    }

    // ==========================================
    // テーブル操作・保存
    // ==========================================
    function isValidRow(row) {
      return String(row.number || '').trim() !== '' && 
             row.lengthCm !== '' && isFinite(Number(row.lengthCm)) && Number(row.lengthCm) > 0 && 
             row.weightG !== '' && isFinite(Number(row.weightG)) && Number(row.weightG) > 0;
    }

    function renderTable() {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';
      if (rows.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="empty">データがありません</td></tr>';
        return;
      }
      rows.forEach((row, index) => {
        const tr = document.createElement('tr');
        if (!isValidRow(row)) tr.className = 'invalid-row';

        tr.innerHTML = `
          <td><input type="text" value="${row.number}" onchange="updateRow(${index}, 'number', this.value)" style="width:60px; text-align:center;"></td>
          <td><input type="number" step="0.1" value="${row.lengthCm}" onchange="updateRow(${index}, 'lengthCm', this.value)" style="width:70px; text-align:right;"></td>
          <td><input type="number" step="0.1" value="${row.weightG}" onchange="updateRow(${index}, 'weightG', this.value)" style="width:70px; text-align:right;"></td>
          <td>
            <select onchange="updateRow(${index}, 'deformity', this.value)" style="width:80px;">
              <option value="なし" ${row.deformity === 'なし' ? 'selected' : ''}>なし</option>
              <option value="A" ${row.deformity === 'A' ? 'selected' : ''}>A</option>
              <option value="B" ${row.deformity === 'B' ? 'selected' : ''}>B</option>
              <option value="C" ${row.deformity === 'C' ? 'selected' : ''}>C</option>
            </select>
          </td>
          <td><button class="small-btn danger" onclick="deleteRow(${index})">削除</button></td>
        `;
        tbody.appendChild(tr);
      });
    }

    function updateRow(index, field, value) { rows[index][field] = value; renderTable(); }
    function deleteRow(index) { rows.splice(index, 1); renderTable(); }
    function addRow() { rows.push({ number: String(getLastNumberInRows() + 1), lengthCm: '', weightG: '', deformity: 'なし' }); renderTable(); }

    async function saveRows() {
      const measurementDate = document.getElementById('measurementDate').value;
      const measurer = document.getElementById('measurer').value;
      const tankName = document.getElementById('tankName').value;

      if (!measurementDate || !measurer || !tankName || rows.length === 0) {
        setSaveStatus('必須項目（測定日・測定者・水槽）を選択してください。', 'error');
        return;
      }
      if (rows.some(row => !isValidRow(row))) {
        setSaveStatus('未入力やエラーの行（赤色）があります。数値を手入力するか、削除してください。', 'error');
        return;
      }

      const payload = {
        action: 'save', measurementDate, measurer, tankName,
        rows: rows.map(r => ({
          number: String(r.number).trim(), lengthCm: Number(r.lengthCm), weightG: Number(r.weightG), deformity: String(r.deformity).trim()
        }))
      };

      setSaveStatus('登録中...', ''); 
      try {
        const response = await fetch(GAS_WEB_APP_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
        const resData = JSON.parse(await response.text());
        if (resData.ok) {
          setSaveStatus(`${resData.count}件のデータを登録完了しました！`, 'ok'); 
          rows = []; renderTable(); document.getElementById('latestText').value = '';
        } else {
          setSaveStatus(`登録エラー: ${resData.error}`, 'error'); 
        }
      } catch (e) { setSaveStatus(`通信エラー: ${e.message}`, 'error'); }
    }

    function setSaveStatus(msg, type) {
      const el = document.getElementById('saveStatus');
      if (el) {
        el.textContent = msg;
        el.className = 'status ' + type;
      }
    }
  </script>
</body>
</html>
