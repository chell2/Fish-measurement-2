<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>魚体測定 音声入力</title>
  <style>
    body {
      margin: 0; padding: 16px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f7fb; color: #222;
    }
    .app { max-width: 900px; margin: 0 auto; }
    h1 { font-size: 24px; margin: 0 0 16px; }
    .card {
      background: #fff; border-radius: 16px; padding: 16px;
      margin-bottom: 16px; box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    }
    label { display: block; font-size: 14px; font-weight: 700; margin-bottom: 6px; }
    input, textarea, select {
      width: 100%; box-sizing: border-box; font-size: 16px;
      padding: 10px 12px; border: 1px solid #d8dde8; border-radius: 10px; background: #fff;
    }
    textarea { min-height: 90px; resize: vertical; }
    .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
    
    .input-group { display: flex; width: 100%; }
    .input-group select { 
      border-radius: 10px 0 0 10px;
      border-right: none; 
      flex-grow: 1; 
      min-width: 0;
    }

    .buttons { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
    
    /* すべてのボタンの基本設定（丸くする） */
    button {
      border: none; border-radius: 999px; padding: 12px 18px;
      font-size: 16px; font-weight: 700; cursor: pointer;
    }

    /* ＋・－ボタン専用設定（基本設定を上書きして四角くする） */
    button.del-btn {
      border-radius: 0 !important; /* マイナスボタンの両端をまっすぐに */
      border: 1px solid #d8dde8 !important; 
      border-right: none !important; 
      background: #fff4f4; color: #d93025;
      padding: 0 14px; font-size: 16px; font-weight: bold;
    }
    button.del-btn:active { background: #fde8e8; }

    button.add-btn {
      border-radius: 0 10px 10px 0 !important; /* プラスボタンは右側だけ丸く */
      border: 1px solid #d8dde8 !important; 
      background: #f8fafd; color: #1a73e8;
      padding: 0 16px; font-size: 18px; font-weight: bold;
    }
    button.add-btn:active { background: #e8eefb; }

    .primary { background: #1a73e8; color: #fff; }
    .danger { background: #d93025; color: #fff; }
    .secondary { background: #e8eefb; color: #1a3d7c; }
    .save { background: #188038; color: #fff; width: 100%; margin-top: 12px; padding: 14px 18px; }
    .status { font-weight: 700; margin-top: 8px; white-space: pre-wrap; }
    .listening { color: #d93025; }
    .processing { color: #1a73e8; }
    .ok { color: #188038; }
    .error { color: #d93025; }
    .mic-meter-wrapper { margin-top: 12px; padding: 12px; background: #f0f4f9; border-radius: 10px; }
    .mic-meter-label { font-size: 13px; font-weight: 700; margin-bottom: 6px; display: flex; justify-content: space-between; }
    .progress-container { background: #d8dde8; border-radius: 8px; height: 16px; width: 100%; overflow: hidden; }
    .progress-bar { height: 100%; width: 0%; background: #aaaaaa; transition: width 0.05s linear; }
    .hint { font-size: 14px; color: #555; line-height: 1.7; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 640px; }
    th, td { border-bottom: 1px solid #e6e9f0; padding: 8px; text-align: left; vertical-align: middle; }
    th { font-size: 13px; background: #f8fafd; }
    td input, td select { padding: 8px; font-size: 15px; }
    .small-btn { padding: 8px 10px; font-size: 13px; border-radius: 8px; }
    .invalid-row { background: #fff4f4; }
    .empty { color: #777; text-align: center; padding: 24px 8px; }

    /* カスタムポップアップ用 */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center;
      z-index: 1000;
    }
    .modal-content {
      background: #fff; padding: 20px; border-radius: 16px; width: 90%; max-width: 320px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    }
    .modal-content h3 { margin: 0 0 12px; font-size: 18px; }
    .modal-content input { margin-bottom: 16px; }
    .modal-buttons { display: flex; justify-content: flex-end; gap: 8px; }
    .modal-buttons button { padding: 10px 16px; font-size: 14px; border-radius: 8px; }

    /* ===== スマホ用の調整 ===== */
    @media (max-width: 640px) {
      body { padding: 12px; } 
      .grid { grid-template-columns: 1fr; }
      h1 { font-size: 21px; } 
      
      .buttons button { width: 100%; }
      input[type="date"] { max-width: 100%; box-sizing: border-box; }
      
      /* スマホ時の幅調整：プルダウン 2/3、マイナス 1/6、プラス 1/6 */
      .input-group select {
        flex: 0 0 66.66%; 
        width: 66.66%;
      }
      button.del-btn, button.add-btn {
        flex: 0 0 16.66%; 
        width: 16.66%;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>魚体測定 音声入力</h1>
    
    <div class="card">
      <div class="grid">
        <div>
          <label for="measurementDate">測定日</label>
          <input type="date" id="measurementDate">
        </div>
        
        <div>
          <label for="measurer">測定者</label>
          <div class="input-group">
            <select id="measurer">
              <option value="" disabled selected>読込中...</option>
            </select>
            <button class="del-btn" type="button" onclick="promptDeleteOption('measurer', '測定者')" title="削除">－</button>
            <button class="add-btn" type="button" onclick="promptAddOption('measurer', '測定者')" title="新規追加">＋</button>
          </div>
        </div>

        <div>
          <label for="tankName">水槽</label>
          <div class="input-group">
            <select id="tankName">
              <option value="" disabled selected>読込中...</option>
            </select>
            <button class="del-btn" type="button" onclick="promptDeleteOption('tank', '水槽')" title="削除">－</button>
            <button class="add-btn" type="button" onclick="promptAddOption('tank', '水槽')" title="新規追加">＋</button>
          </div>
        </div>
    </div>

    <div class="card">
      <label>音声入力</label>
      <div class="hint">
        話し方の例：<br>
        「10番 13センチ 27グラム」<br>
        「13センチ 36グラム 形態異常B」<br>
      </div>
      <div class="buttons">
        <button class="secondary" onclick="runMicTest()">🎙️ 音量テスト</button>
        <button class="primary" onclick="startListening()">マイク開始</button>
        <button class="danger" onclick="stopListening()">マイク停止</button>
        <button class="secondary" onclick="processTextToTable()">📝 表に反映</button>
        <button class="secondary" onclick="addManualRow()">手入力で追加</button>
      </div>
      <div class="mic-meter-wrapper">
        <div class="mic-meter-label">
          <span>マイク入力音量</span>
          <span id="micVolumeValue">0 %</span>
        </div>
        <div class="progress-container">
          <div id="micVolumeBar" class="progress-bar"></div>
        </div>
      </div>
      <div id="status" class="status">待機中</div>
      <div style="margin-top: 12px;">
        <label for="latestText">テキスト化結果</label>
        <textarea id="latestText" placeholder="ここに解析結果が表示されます。話し終えると自動的に表へ反映されます。"></textarea>
      </div>
    </div>

    <div class="card">
      <label>測定一覧</label>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th style="width:100px;">ナンバー</th>
              <th style="width:140px;">体長cm</th>
              <th style="width:140px;">体重g</th>
              <th style="width:130px;">変形レベル</th>
              <th style="width:90px;">操作</th>
            </tr>
          </thead>
          <tbody id="tbody">
            <tr><td colspan="5" class="empty">まだ測定データがありません</td></tr>
          </tbody>
        </table>
      </div>
      <button class="save" onclick="saveRows()">スプレッドシートに登録</button>
      <div id="saveStatus" class="status"></div>
    </div>
  </div>
  <!-- カスタムポップアップ画面 -->
  <div id="customModal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <h3 id="modalTitle">新しい項目を追加</h3>
      <input type="text" id="modalInput" placeholder="名前を入力">
      <!-- エラーメッセージ表示用 -->
      <p id="modalError" style="color: #d93025; font-size: 13px; display: none; margin-top: -8px; margin-bottom: 12px; font-weight: bold;"></p>
      <div class="modal-buttons">
        <button class="secondary" onclick="closeModal()">キャンセル</button>
        <button class="primary" onclick="submitModal()">追加する</button>
      </div>
    </div>
  </div>
  <!-- 削除確認用ポップアップ画面 -->
  <div id="deleteModal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <h3 id="deleteModalTitle">項目の削除</h3>
      <p id="deleteModalText" style="margin-bottom: 20px; font-size: 15px;"></p>
      <div class="modal-buttons">
        <button class="secondary" onclick="closeDeleteModal()">キャンセル</button>
        <button class="danger" onclick="submitDeleteModal()">削除する</button>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. 設定用定数（デプロイURLをここに貼る）
    // ==========================================
    const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxp2lcJyDW3NLUnxXGpIB9T7k1S-DnC1xi23yzWJPiFiw4VSmhQjWAjibba1Iqg0o0gBg/exec';

    let recognition = null;
    let isListening = false;
    let rows = [];
    let silenceTimer = null;
    let audioCtx = null;
    let analyser = null;
    let micStream = null;
    let animFrameId = null;

    window.addEventListener('DOMContentLoaded', () => {
      const today = new Date();
      const yyyy = today.getFullYear();
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const dd = String(today.getDate()).padStart(2, '0');
      document.getElementById('measurementDate').value = `${yyyy}-${mm}-${dd}`;
      
      renderTable();
      setupSpeechRecognition();

      // ★ 起動時にスプレッドシートからリストを読み込む
      loadOptionsFromServer();
    });

    // --- ドロップダウンリスト管理処理 ---
    async function loadOptionsFromServer() {
      try {
        const response = await fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'getOptions' })
        });
        const data = await response.json();
        
        if (data.ok) {
          updateSelectOptions('measurer', data.measurers, '測定者を選択');
          updateSelectOptions('tankName', data.tanks, '水槽を選択');
        } else {
          console.error("リスト読み込みエラー: ", data.error);
        }
      } catch (err) {
        console.error("通信エラー: ", err);
      }
    }

    function updateSelectOptions(elementId, items, placeholder) {
      const select = document.getElementById(elementId);
      select.innerHTML = `<option value="" disabled selected>${placeholder}</option>`;
      items.forEach(item => {
        const option = document.createElement('option');
        option.value = item;
        option.textContent = item;
        select.appendChild(option);
      });
    }

    let currentModalType = '';
    let currentModalLabel = '';

    function promptAddOption(type, label) {
      currentModalType = type;
      currentModalLabel = label;
      document.getElementById('modalTitle').textContent = `新しい${label}を追加`;
      document.getElementById('modalInput').value = '';
      document.getElementById('modalError').style.display = 'none'; // エラー表示をリセット
      document.getElementById('customModal').style.display = 'flex';
      document.getElementById('modalInput').focus();
    }

    function closeModal() {
      document.getElementById('customModal').style.display = 'none';
    }

    async function submitModal() {
      const newVal = document.getElementById('modalInput').value.trim();
      const errorEl = document.getElementById('modalError');
      
      // 空欄チェック
      if (!newVal) {
        errorEl.textContent = '名前を入力してください。';
        errorEl.style.display = 'block';
        return;
      }
      
      // 重複チェック
      const selectId = currentModalType === 'measurer' ? 'measurer' : 'tankName';
      const selectElement = document.getElementById(selectId);
      
      // 現在のプルダウンにある選択肢（文字列）をすべて取得して配列にする
      const existingValues = Array.from(selectElement.options).map(opt => opt.value);
      
      if (existingValues.includes(newVal)) {
        // 重複している場合はエラーを出して処理を中断する（ダイアログは閉じない）
        errorEl.textContent = `「${newVal}」は既に存在します。別の名前を入力してください。`;
        errorEl.style.display = 'block';
        return;
      }
      
      // 問題なければポップアップを閉じて追加処理へ進む
      closeModal(); 
      
      selectElement.innerHTML = `<option value="" disabled selected>保存中...</option>`;
      
      try {
        const response = await fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'addOption', type: currentModalType, value: newVal })
        });
        const data = await response.json();
        
        if (data.ok) {
          await loadOptionsFromServer();
          document.getElementById(currentModalType === 'measurer' ? 'measurer' : 'tankName').value = data.value;
        } else {
          // 通信エラーなどのシステムエラー時
          alert('追加に失敗しました: ' + data.error);
          await loadOptionsFromServer();
        }
      } catch (err) {
        alert('通信エラーが発生しました。');
        await loadOptionsFromServer();
      }
    }

    // --- 削除ポップアップ用処理 ---
    let targetDeleteType = '';
    let targetDeleteValue = '';

    function promptDeleteOption(type, label) {
      const selectId = type === 'measurer' ? 'measurer' : 'tankName';
      const selectElement = document.getElementById(selectId);
      const selectedValue = selectElement.value;

      if (!selectedValue) return; // 選択されていない場合は何もしない

      targetDeleteType = type;
      targetDeleteValue = selectedValue;

      document.getElementById('deleteModalText').textContent = `${label}「${selectedValue}」をリストから完全に削除しますか？`;
      document.getElementById('deleteModal').style.display = 'flex';
    }

    function closeDeleteModal() {
      document.getElementById('deleteModal').style.display = 'none';
    }

    async function submitDeleteModal() {
      closeDeleteModal();
      
      const selectElement = document.getElementById(targetDeleteType === 'measurer' ? 'measurer' : 'tankName');
      selectElement.innerHTML = `<option value="" disabled selected>削除中...</option>`;
      
      try {
        const response = await fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'deleteOption', type: targetDeleteType, value: targetDeleteValue })
        });
        const data = await response.json();
        
        if (data.ok) {
          await loadOptionsFromServer(); // 削除後にリストを再読み込み
        } else {
          alert('削除に失敗しました: ' + data.error);
          await loadOptionsFromServer();
        }
      } catch (err) {
        alert('通信エラーが発生しました。');
        await loadOptionsFromServer();
      }
    }

    // --- 音量メーター処理 ---
    async function startVolumeMeter() {
      try {
        stopVolumeMeter();
        micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false } });
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') await audioCtx.resume();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 512;
        analyser.smoothingTimeConstant = 0.3;
        const source = audioCtx.createMediaStreamSource(micStream);
        source.connect(analyser);
        const dataArray = new Uint8Array(analyser.frequencyBinCount);
        const bar = document.getElementById('micVolumeBar');
        const valText = document.getElementById('micVolumeValue');
        function update() {
          if (!analyser) return;
          analyser.getByteFrequencyData(dataArray);
          let sum = 0;
          for (let i = 0; i < dataArray.length; i++) sum += dataArray[i] * dataArray[i];
          let rms = Math.sqrt(sum / dataArray.length);
          let level = Math.min(100, Math.round((rms / 128) * 100 * 2.2));
          bar.style.width = level + '%';
          valText.textContent = level + ' %';
          if (level > 75) bar.style.background = '#d93025';
          else if (level > 3) bar.style.background = '#188038';
          else bar.style.background = '#aaaaaa';
          animFrameId = requestAnimationFrame(update);
        }
        update();
        return true;
      } catch (err) {
        setStatus(`マイクアクセスエラー: ブラウザでマイクがブロックされていないか確認してください。（${err.message}）`, 'error');
        return false;
      }
    }

    function stopVolumeMeter() {
      if (animFrameId) cancelAnimationFrame(animFrameId);
      animFrameId = null;
      if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
      if (audioCtx) { audioCtx.close(); audioCtx = null; }
      analyser = null;
      document.getElementById('micVolumeBar').style.width = '0%';
      document.getElementById('micVolumeBar').style.background = '#aaaaaa';
      document.getElementById('micVolumeValue').textContent = '0 %';
    }

    async function runMicTest() {
      if (isListening) stopListening();
      setStatus('マイク音量テスト中（5秒間）... マイクに向かって声を出してください。', 'processing');
      let maxLevelDetected = 0;
      const ok = await startVolumeMeter();
      if (!ok) return;
      const checkInterval = setInterval(() => {
        const currentLevel = parseInt(document.getElementById('micVolumeValue').textContent, 10) || 0;
        if (currentLevel > maxLevelDetected) maxLevelDetected = currentLevel;
      }, 100);
      setTimeout(() => {
        clearInterval(checkInterval);
        stopVolumeMeter();
        if (maxLevelDetected > 3) setStatus(`テスト完了：正常に検知しました（最大音量: ${maxLevelDetected}%）`, 'ok');
        else setStatus('テスト完了：音量が検知されませんでした。設定を見直してください。', 'error');
      }, 5000);
    }

    // --- テキスト解析 ＆ テーブル反映処理 ---
    function processTextToTable() {
      const text = document.getElementById('latestText').value.trim();
      if (!text) return setStatus('テキストエリアに音声結果が入っていません。', 'error');
      const parsedRows = parseSpeechText(text);
      if (parsedRows.length > 0) {
        rows.push(...parsedRows);
        renderTable();
        setStatus(`${parsedRows.length} 件の測定データを表に追加しました。`, 'ok');
        document.getElementById('latestText').value = '';
      } else setStatus('数値データ（体長・体重など）を読み取れませんでした。', 'error');
    }

    function parseSpeechText(text) {
      const normalized = normalizeText(text);
      const textWithoutPunctuation = normalized.replace(/[。、！？]/g, ' ');
      let rawChunks = textWithoutPunctuation.replace(/(\d+)\s*(?:番|ばん)/g, '\n$1番 ').replace(/次|つぎ/g, '\n').split('\n').map(s => s.trim()).filter(Boolean);
      const parsed = [];
      rawChunks.forEach(chunk => {
        const parsedRows = parseOneChunk(chunk);
        if (parsedRows && parsedRows.length > 0) parsed.push(...parsedRows);
      });
      return parsed;
    }

    function parseOneChunk(chunk) {
      let number = null;
      const numberMatch = chunk.match(/(\d+)\s*(?:番|ばん|ナンバー|no|No|NO)/);
      if (numberMatch) number = numberMatch[1];
      let bodyText = chunk.replace(/(\d+)\s*(?:番|ばん|ナンバー|no|No|NO)/g, '').trim();
      const nums = bodyText.match(/[0-9]+(?:\.[0-9]+)?/g) || [];
      if (nums.length < 2) return null;
      let deformity = findDeformityLevel(chunk);
      const results = [];
      for (let i = 0; i < nums.length - 1; i += 2) {
        const lengthCm = Number(nums[i]);
        const weightG = Number(nums[i + 1]);
        if (isFinite(lengthCm) && isFinite(weightG)) {
          results.push({
            number: number || String(getLastNumberInRows() + results.length + 1),
            lengthCm, weightG, deformity: deformity || 'なし'
          });
        }
      }
      return results;
    }

    function normalizeText(text) {
      let str = String(text || '');
      const kansujiMap = {'一':'1','二':'2','三':'3','四':'4','五':'5','六':'6','七':'7','八':'8','九':'9'};
      str = str.replace(/([二三四五六七八九])十([一二三四五六七八九])/g, (m, a, b) => kansujiMap[a] + kansujiMap[b]);
      str = str.replace(/([二三四五六七八九])十/g, (m, a) => kansujiMap[a] + '0');
      str = str.replace(/十([一二三四五六七八九])/g, (m, a) => '1' + kansujiMap[a]);
      str = str.replace(/十/g, '10');
      str = str.replace(/[〇一二三四五六七八九]/g, m => (kansujiMap[m] || '0'));
      return str.replace(/[０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0))
        .replace(/[Ａ-Ｚａ-ｚ]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0))
        .replace(/．/g, '.').replace(/点/g, '.')
        .replace(/センチメートル|センチ|cm|ミリメートル|ミリ|mm/gi, ' ')
        .replace(/キログラム|キロ|グラム|g|kg/gi, ' ')
        .replace(/\s+/g, ' ').trim();
    }

    function findDeformityLevel(text) {
      const str = String(text || '').trim();
      if (str.match(/(?:形態異常|変形|レベル|異常|タイプ).*?(?:[Cсシーしー]|女子|じょし|よし|四)/i)) return 'C';
      if (str.match(/(?:形態異常|変形|レベル|異常|タイプ).*?(?:[Bｂビーびー]|美|微)/i)) return 'B';
      if (str.match(/(?:形態異常|変形|レベル|異常|タイプ).*?(?:[Aａエーえー]|絵)/i)) return 'A';
      if (str.match(/(?:^|\s)(?:[Cсシーしー]|女子|じょし|よし|四)(?:\s|$)/i)) return 'C';
      if (str.match(/(?:^|\s)(?:[Bｂビーびー]|美|微)(?:\s|$)/i)) return 'B';
      if (str.match(/(?:^|\s)(?:[Aａエーえー]|絵)(?:\s|$)/i)) return 'A';
      if (str.match(/なし|無し|無|正常/)) return 'なし';
      return 'なし';
    }

    function getLastNumberInRows() {
      if (rows.length === 0) return 0;
      return rows.reduce((max, row) => {
        const n = Number(row.number);
        return isFinite(n) && n > max ? n : max;
      }, 0);
    }

    // --- リアルタイムマイク ---
    function setupSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) return setStatus('このブラウザはリアルタイム音声入力に対応していません。', 'error');
      recognition = new SpeechRecognition();
      recognition.lang = 'ja-JP'; recognition.continuous = true; recognition.interimResults = true;
      recognition.onstart = () => setStatus('マイク聞き取り中... 測定値を話してください。', 'listening');
      recognition.onresult = (event) => {
        let interim = ''; let finalTranscript = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          if (event.results[i].isFinal) finalTranscript += event.results[i][0].transcript + ' ';
          else interim += event.results[i][0].transcript;
        }
        if (finalTranscript || interim) document.getElementById('latestText').value = (finalTranscript + interim).trim();
        clearTimeout(silenceTimer);
        // 5秒のインターバル設定
        silenceTimer = setTimeout(() => {
          if (document.getElementById('latestText').value.trim()) processTextToTable();
        }, 5000);
      };
      recognition.onerror = (event) => { if (event.error !== 'no-speech') setStatus(`音声認識エラー: ${event.error}`, 'error'); };
      recognition.onend = () => {
        if (isListening) try { recognition.start(); } catch (e) {}
        else setStatus('マイク停止中', '');
      };
    }
    function startListening() {
      stopVolumeMeter();
      if (!recognition) setupSpeechRecognition();
      isListening = true;
      try { recognition.start(); } catch (e) { setStatus('すでに聞き取り中です。', 'listening'); }
    }
    function stopListening() {
      isListening = false;
      clearTimeout(silenceTimer);
      if (recognition) recognition.stop();
      setStatus('マイク停止中', '');
      if (document.getElementById('latestText').value.trim()) processTextToTable();
    }

    // --- テーブル操作 ---
    function addManualRow() {
      const nextNum = getLastNumberInRows() + 1;
      rows.push({ number: String(nextNum), lengthCm: '', weightG: '', deformity: 'なし' });
      renderTable();
    }
    function renderTable() {
      const tbody = document.getElementById('tbody');
      if (rows.length === 0) return tbody.innerHTML = `<tr><td colspan="5" class="empty">まだ測定データがありません</td></tr>`;
      tbody.innerHTML = rows.map((row, index) => {
        const invalid = !isValidRow(row);
        return `
          <tr class="${invalid ? 'invalid-row' : ''}">
            <td><input type="text" value="${escapeHtml(row.number)}" onchange="updateRow(${index}, 'number', this.value)"></td>
            <td><input type="number" step="0.1" value="${escapeHtml(row.lengthCm)}" onchange="updateRow(${index}, 'lengthCm', this.value)"></td>
            <td><input type="number" step="0.1" value="${escapeHtml(row.weightG)}" onchange="updateRow(${index}, 'weightG', this.value)"></td>
            <td>
              <select onchange="updateRow(${index}, 'deformity', this.value)">
                <option value="なし" ${row.deformity === 'なし' ? 'selected' : ''}>なし</option>
                <option value="A" ${row.deformity === 'A' ? 'selected' : ''}>A</option>
                <option value="B" ${row.deformity === 'B' ? 'selected' : ''}>B</option>
                <option value="C" ${row.deformity === 'C' ? 'selected' : ''}>C</option>
              </select>
            </td>
            <td><button class="danger small-btn" onclick="deleteRow(${index})">削除</button></td>
          </tr>
        `;
      }).join('');
    }
    function updateRow(index, key, value) { rows[index][key] = value; renderTable(); }
    function deleteRow(index) { rows.splice(index, 1); renderTable(); }
    function isValidRow(row) {
      return String(row.number || '').trim() !== '' && isFinite(Number(row.lengthCm)) && Number(row.lengthCm) > 0 && isFinite(Number(row.weightG)) && Number(row.weightG) > 0;
    }

    // --- スプレッドシート保存処理 ---
    async function saveRows() {
      const measurementDate = document.getElementById('measurementDate').value;
      const measurer = document.getElementById('measurer').value;
      const tankName = document.getElementById('tankName').value;

      if (!measurementDate || !measurer || !tankName || rows.length === 0) {
        setSaveStatus('必須項目（測定日・測定者・水槽）を選択してください。またはデータがありません。', 'error');
        return;
      }

      const payload = {
        action: 'save', measurementDate, measurer, tankName,
        rows: rows.map(r => ({
          number: String(r.number).trim(), lengthCm: Number(r.lengthCm), weightG: Number(r.weightG), deformity: String(r.deformity).trim()
        }))
      };

      setSaveStatus('スプレッドシートへ保存中...', '');
      try {
        const response = await fetch(GAS_WEB_APP_URL, {
          method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload)
        });
        const resData = JSON.parse(await response.text());
        if (resData.ok) {
          setSaveStatus(`${resData.count}件のデータをスプレッドシートに登録しました！`, 'ok');
          rows = []; renderTable(); document.getElementById('latestText').value = '';
        } else setSaveStatus(`保存エラー: ${resData.error}`, 'error');
      } catch (e) {
        setSaveStatus(`通信エラー: ${e.message}`, 'error');
      }
    }

    function setStatus(message, type) {
      const el = document.getElementById('status');
      el.textContent = message; el.className = `status ${type || ''}`;
    }
    function setSaveStatus(message, type) {
      const el = document.getElementById('saveStatus');
      el.textContent = message; el.className = `status ${type || ''}`;
    }
    function escapeHtml(value) {
      return String(value ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
